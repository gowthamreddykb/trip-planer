{% extends "base.html" %}

{% block title %}Internal Server Error — Trip Planner{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card tp-card p-5 border-0 shadow-sm">
        <div class="rounded-circle bg-danger bg-opacity-10 d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px;">
          <i class="bi bi-exclamation-triangle fs-2 text-danger"></i>
        </div>

        <h3 class="fw-bold travel-heading mb-2 text-dark">Something Went Wrong</h3>
        <p class="text-muted mb-4">
          An unexpected error occurred while processing your request. Please try again in a few moments.
        </p>

        <div>
          <a href="{{ url_for('home') }}" class="btn btn-tp-primary px-4 py-2">
            Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
