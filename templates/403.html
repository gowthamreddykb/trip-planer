{% extends "base.html" %}

{% block title %}Access Denied — Trip Planner{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <!-- Card matching Reference Image 3 Screen 8 (Validation / Access Control) -->
      <div class="card tp-card p-5 border-0 shadow-sm">
        <div class="rounded-circle bg-danger bg-opacity-10 d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px;">
          <i class="bi bi-shield-lock fs-2 text-danger"></i>
        </div>

        <h3 class="fw-bold travel-heading mb-2 text-dark">{{ title or "Access Denied" }}</h3>
        
        <p class="text-muted mb-4">
          {{ message or "This private trip belongs to another user, or you do not have permission to view this resource." }}
        </p>

        <div>
          <a href="{{ url_for('my_trips') }}" class="btn btn-tp-primary px-4 py-2">
            <i class="bi bi-briefcase me-1"></i> Back to My Trips
          </a>
          <a href="{{ url_for('home') }}" class="btn btn-outline-secondary px-4 py-2 ms-2">
            Home
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
